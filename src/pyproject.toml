[project]
name = "ridgeback-env"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pranav Chitiveli", email = "pchitive@purdue.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.0",
    "robocasa",
    "robosuite",
    "setuptools<81",
    "xacro>=2.1.1",
]

[project.scripts]
ridgeback-env = "ridgeback_env:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
]

[tool.uv.sources]
robocasa = { path = "../robocasa", editable = true }
robosuite = { path = "../robosuite", editable = true }
